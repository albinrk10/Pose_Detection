name: test_1
description: Contador de flexiones con detección de postura en tiempo real usando Google ML Kit y Clean Architecture.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  camera: ^0.10.5+5
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  google_mlkit_commons: ^0.13.0
  google_mlkit_pose_detection: ^0.16.1
  image_picker: ^1.0.4
  lottie: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/screenshots/
